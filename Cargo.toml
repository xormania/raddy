[workspace]
resolver = "3"
members = [
    "crates/raddy",
    "crates/raddy-config",
    "crates/raddy-abi",
    "crates/raddy-executor",
    "crates/raddy-server",
    "crates/raddy-bdd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
figment = { version = "0.10.19", features = ["toml", "env"] }
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "io-util", "sync", "time", "net", "signal"] }
bytes = "1.12.1"
wasmtime = "47.0.3"
cucumber = "0.23.0"
proptest = "1.11.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.4"
serde_json = "1.0.151"
ulid = { version = "3.0.0", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
